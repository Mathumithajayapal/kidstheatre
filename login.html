<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Login | Kids Theater</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            primary: '#6366F1', // Kids Theater Indigo
            primaryHover: '#4F46E5', // Darker Indigo
            darkBg: '#0B0F19', // Deep theater dark
            darkHeader: '#151D2E',
            'brand-dark': '#111827', 
            'brand-light': '#F8FAFC', 
            'brand-muted': '#6B7280'
          }
        }
      }
    }
  </script>
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-fade-in {
      animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    
    /* Unique Stage Spotlight Background */
    .spotlight-bg {
      background-color: #F8FAFC;
      background-image: radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.25) 0%, transparent 60%);
    }
    .dark .spotlight-bg {
      background-color: #0B0F19;
      background-image: radial-gradient(circle at 50% -20%, rgba(99, 102, 241, 0.2) 0%, transparent 60%);
    }
    
    [dir="rtl"] { direction: rtl; }

    /* Ensure no horizontal scroll */
    html, body {
      overflow-x: hidden;
      width: 100%;
    }
  </style>
</head>
<body class="font-sans antialiased spotlight-bg h-screen overflow-hidden flex flex-col transition-colors duration-300 relative">

  <!-- Theme & RTL Toggles -->
  <div class="w-full flex justify-end p-4 z-50 shrink-0 relative">
    <div class="flex items-center gap-3 bg-white dark:bg-darkHeader shadow-sm rounded-full px-4 py-2 border border-gray-200 dark:border-gray-800">
      <button id="rtl-toggle" class="text-[10px] font-bold text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors uppercase tracking-widest shrink-0" title="Toggle RTL">
        RTL
      </button>
      <div class="w-px h-4 bg-gray-300 dark:bg-gray-700"></div>
      <button id="theme-toggle" class="relative w-[60px] h-[28px] flex items-center bg-gray-100 dark:bg-[#1E293B] rounded-full p-1 transition-colors duration-300 focus:outline-none border border-gray-200 dark:border-gray-700 shrink-0" title="Toggle Theme">
        <span class="text-[8px] font-bold text-gray-500 absolute end-2 dark:opacity-0 transition-opacity duration-300">LHT</span>
        <span class="text-[8px] font-bold text-primary absolute start-2 opacity-0 dark:opacity-100 transition-opacity duration-300">DRK</span>
        
        <div class="w-[20px] h-[20px] bg-white dark:bg-darkBg rounded-full shadow-sm transform transition-transform duration-300 flex items-center justify-center rtl:dark:-translate-x-[30px] ltr:dark:translate-x-[30px] dark:translate-x-[30px] z-10">
          <i class="fas fa-sun text-[10px] text-primary dark:hidden block"></i>
          <i class="fas fa-moon text-[10px] text-primary hidden dark:block"></i>
        </div>
      </button>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto flex flex-col items-center px-4">
    <!-- Top Spacer for safe vertical centering -->
    <div class="flex-1 shrink-0 min-h-[24px]"></div>
    
    <!-- Main Login Card (New Solid Design) -->
    <div class="w-full max-w-sm bg-white dark:bg-darkHeader shadow-[0_20px_50px_-12px_rgba(99,102,241,0.15)] dark:shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] p-6 md:p-8 border-2 border-indigo-50 dark:border-gray-800/50 relative z-10 animate-fade-in group rounded-[2rem] shrink-0">
        
        <!-- Header / Logo -->
        <div class="text-center mb-8">
          <a href="index.html" class="inline-flex flex-row items-center justify-center gap-3 no-underline mb-5 text-brand-dark dark:text-white transition-transform hover:scale-105 duration-300">
            <i class="fas fa-masks-theater text-primary text-3xl drop-shadow-sm"></i>
            <h1 class="text-2xl font-bold tracking-widest uppercase">Kids Theater</h1>
          </a>
          <h2 class="text-xl font-extrabold text-brand-dark dark:text-gray-100 uppercase tracking-tight mb-2">Welcome Back</h2>
          <p class="text-[10px] uppercase tracking-[0.2em] font-semibold text-brand-muted">Sign in to the Parent Portal</p>
        </div>

        <!-- Login Form -->
        <form class="flex flex-col gap-4" onsubmit="handleLogin(event)">

          <!-- Email Input -->
          <div>
              <label class="block text-[10px] font-bold uppercase tracking-widest text-brand-dark dark:text-gray-300 mb-2 ms-1">
                Email Address
              </label>
              <input 
                type="email" 
                required
                placeholder="YOUR.EMAIL@EXAMPLE.COM"
                class="w-full px-3 py-3 bg-slate-50 dark:bg-[#0B0F19] border-2 border-transparent text-brand-dark dark:text-white text-xs uppercase tracking-widest focus:outline-none focus:border-primary focus:bg-white dark:focus:bg-darkHeader rounded-xl transition-all shadow-inner dark:shadow-none"
              />
          </div>

          <!-- Password Input -->
          <div>
              <label class="block text-[10px] font-bold uppercase tracking-widest text-brand-dark dark:text-gray-300 mb-2 ms-1">
                Password
              </label>
              <div class="relative">
                <input 
                    type="password" 
                    id="password"
                    required
                    placeholder="ENTER YOUR PASSWORD"
                    class="w-full px-3 py-3 bg-slate-50 dark:bg-[#0B0F19] border-2 border-transparent text-brand-dark dark:text-white text-xs uppercase tracking-widest focus:outline-none focus:border-primary focus:bg-white dark:focus:bg-darkHeader rounded-xl transition-all shadow-inner dark:shadow-none"
                />
                <button 
                    type="button" 
                    onclick="togglePassword()"
                    class="absolute end-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors focus:outline-none"
                >
                    <i class="fas fa-eye text-sm" id="toggleIcon"></i>
                </button>
              </div>
          </div>

          <!-- Form Options -->
          <div class="flex items-center justify-between text-[10px] sm:text-xs pt-2">
              <label class="flex items-center cursor-pointer group-checkbox">
                <input type="checkbox" class="w-3 h-3 sm:w-4 sm:h-4 rounded border-gray-300 text-primary focus:ring-primary bg-transparent">
                <span class="ms-2 text-brand-muted font-bold uppercase tracking-widest">Remember me</span>
              </label>
              <span class="text-primary font-bold uppercase tracking-widest cursor-pointer hover:text-brand-dark dark:hover:text-white transition-colors">
                Forgot password?
              </span>
          </div>

          <!-- Submit Button -->
          <button 
              type="submit"
              class="w-full py-3 mt-4 bg-brand-dark dark:bg-white text-white dark:text-brand-dark hover:bg-primary dark:hover:bg-primary hover:text-white font-extrabold uppercase tracking-widest text-xs transition-all duration-300 flex items-center justify-center gap-2 rounded-xl"
          >
              <span>Sign In</span>
              <i class="fas fa-arrow-right text-[10px] rtl:rotate-180"></i>
          </button>

          <!-- Divider -->
          <div class="relative my-6">
              <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
              </div>
              <div class="relative flex justify-center text-[10px] uppercase tracking-widest font-bold">
                <span class="px-3 bg-white dark:bg-darkHeader text-brand-muted">Or Continue With</span>
              </div>
          </div>

          <!-- Social Logins -->
          <div class="flex flex-row items-center justify-center gap-4">
              <!-- Google -->
              <button 
                type="button" title="Sign in with Google"
                class="flex items-center justify-center w-12 h-12 bg-slate-50 dark:bg-[#0B0F19] border border-gray-200 dark:border-gray-800 hover:border-primary dark:hover:border-primary hover:text-primary transition-all rounded-2xl"
              >
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
              </button>

              <!-- Apple -->
              <button 
                type="button" title="Sign in with Apple"
                class="flex items-center justify-center w-12 h-12 bg-slate-50 dark:bg-[#0B0F19] border border-gray-200 dark:border-gray-800 hover:border-primary dark:hover:border-primary hover:text-primary transition-all rounded-2xl text-brand-dark dark:text-gray-200"
              >
                <i class="fab fa-apple text-xl"></i>
              </button>

              <!-- Facebook -->
              <button 
                type="button" title="Sign in with Facebook"
                class="flex items-center justify-center w-12 h-12 bg-slate-50 dark:bg-[#0B0F19] border border-gray-200 dark:border-gray-800 hover:border-primary dark:hover:border-primary transition-all rounded-2xl text-blue-600"
              >
                <i class="fab fa-facebook text-xl"></i>
              </button>
          </div>

        </form>

        <!-- Sign Up Link -->
        <div class="mt-8 text-center text-[10px] sm:text-xs font-bold uppercase tracking-widest text-brand-muted">
          No Account? 
          <a href="register.html" class="text-primary hover:text-primaryHover transition-colors ms-1 font-extrabold underline decoration-2 underline-offset-4">
              Sign Up
          </a>
        </div>

    </div>

    <!-- Bottom Spacer for safe vertical centering -->
    <div class="flex-1 shrink-0 min-h-[24px]"></div>
  </div>

  <script>
    // Toggle Password Visibility
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }

    // Handle Login Submit (Simulation)
    function handleLogin(event) {
      event.preventDefault();

      const button = event.target.querySelector('button[type="submit"]');
      const icon = button.querySelector('i');
      const span = button.querySelector('span');
      
      icon.className = 'fas fa-spinner fa-spin';
      span.innerText = 'AUTHENTICATING...';
      button.disabled = true;
      button.classList.add('opacity-50', 'cursor-not-allowed');

      // Simulate API call, then redirect to the User Dashboard
      setTimeout(() => {
        window.location.href = 'user.html';
      }, 1500);
    }

    // Theme Toggle Function
    const themeToggle = document.getElementById('theme-toggle');
    const html = document.documentElement;

    function toggleTheme() {
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        html.classList.remove('dark-mode');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        html.classList.add('dark-mode');
        localStorage.setItem('theme', 'dark');
      }
    }

    if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
    if (localStorage.getItem('theme') === 'dark') {
      html.classList.add('dark');
      html.classList.add('dark-mode');
    }

    // RTL Toggle Function
    const rtlToggle = document.getElementById('rtl-toggle');

    function toggleRTL() {
      if (html.getAttribute('dir') === 'rtl') {
        html.removeAttribute('dir');
        localStorage.setItem('direction', 'ltr');
      } else {
        html.setAttribute('dir', 'rtl');
        localStorage.setItem('direction', 'rtl');
      }
    }

    if (rtlToggle) rtlToggle.addEventListener('click', toggleRTL);
    if (localStorage.getItem('direction') === 'rtl') html.setAttribute('dir', 'rtl');

  </script>

</body>
</html>
